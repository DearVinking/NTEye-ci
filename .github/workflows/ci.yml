name: CI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA of DearVinking/NTEye to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.sha }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust fmt & agent-smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/cargo-build-cache
            tools/agent-smoke -> tools/agent-smoke/target

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint agent-smoke
        run: cargo clippy --manifest-path tools/agent-smoke/Cargo.toml --all-targets -- -D warnings

      - name: Test agent-smoke
        run: cargo test --manifest-path tools/agent-smoke/Cargo.toml

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  frontend-linux:
    name: Frontend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run frontend quality gate
        run: pnpm run lint:full

      - name: Build desktop frontend
        run: pnpm run build

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  security-linux:
    name: Dependency Security (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          cargo audit

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Audit production dependencies
        working-directory: apps/desktop
        run: pnpm audit --prod --audit-level high

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  macos-gate:
    name: CI gate (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/cargo-build-cache
            tools/agent-smoke -> tools/agent-smoke/target

      - name: Run CI gate
        run: cargo xtask ci

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  macos-sanitizer:
    name: macOS ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Build Rust FFI library
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: cargo build -p nteye-ffi

      - name: Run Swift tests with ${{ matrix.sanitizer }} sanitizer
        working-directory: apps/desktop-mac/NTEyeApp
        run: >-
          swift test
          --force-resolved-versions
          --sanitize ${{ matrix.sanitizer }}
          --explicit-target-dependency-import-check error

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  macos-main-thread-checker:
    name: macOS Main Thread Checker
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Run AppKit smoke with Main Thread Checker
        run: cargo xtask macos-main-thread-checker

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  macos-swift-coverage:
    name: macOS Swift coverage
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Build Rust FFI library
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: cargo build -p nteye-ffi

      - name: Run Swift tests with coverage
        working-directory: apps/desktop-mac/NTEyeApp
        run: >-
          swift test
          --force-resolved-versions
          --enable-code-coverage
          --explicit-target-dependency-import-check error

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  windows-stable:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/cargo-build-cache
            tools/agent-smoke -> tools/agent-smoke/target

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check production complexity
        run: cargo xtask check-complexity

      - name: Test agent-smoke
        run: cargo test --manifest-path tools/agent-smoke/Cargo.toml

      - name: Lint agent-smoke
        run: cargo clippy --manifest-path tools/agent-smoke/Cargo.toml --all-targets -- -D warnings

      - name: Check generated bindings
        run: cargo test -p nteye-desktop generated_bindings_are_current -- --nocapture

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  windows-msrv:
    name: MSRV (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          ref: ${{ github.event.inputs.sha }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0

      - name: Check workspace
        run: cargo +1.93.0 check --workspace --all-targets

      - name: Check agent-smoke
        run: cargo +1.93.0 check --manifest-path tools/agent-smoke/Cargo.toml --all-targets

      - name: Report status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: >-
          gh api -X POST "repos/DearVinking/NTEye/statuses/${{ github.event.inputs.sha }}"
          -f state="$STATE"
          -f context="ci/${{ github.job }}"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
