name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：build 仅构建产物，release 发布 GitHub Release。"
        required: true
        default: "build"
        type: choice
        options:
          - "build"
          - "release"
      tagName:
        description: "已存在的发布 tag，例如 v0.1.1。release 模式下必填。"
        required: false
        type: string
      prerelease:
        description: "强制将 GitHub Release 标记为预发布版本。"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: DearVinking/NTEye

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tagName }}
  cancel-in-progress: false

jobs:
  build-desktop-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          token: ${{ secrets.CI_TOKEN }}
          ref: ${{ github.event.inputs.tagName }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target/cargo-build-cache

      - name: Desktop install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        working-directory: apps/desktop
        run: pnpm exec tauri build --no-bundle

      - name: Build updater helper
        run: cargo build --release -p nteye-desktop --bin nteye-updater

      - name: Upload desktop binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-desktop-binaries
          path: |
            target/release/nteye.exe
            target/release/nteye-updater.exe
          if-no-files-found: error

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs:
      - build-desktop-windows
    outputs:
      tagName: ${{ steps.package.outputs.tagName }}
      portableZipPath: ${{ steps.package.outputs.portableZipPath }}
      portableAssetName: ${{ steps.package.outputs.portableAssetName }}
      updateZipPath: ${{ steps.package.outputs.updateZipPath }}
      updateAssetName: ${{ steps.package.outputs.updateAssetName }}
      updateSignatureName: ${{ steps.package.outputs.updateSignatureName }}
      manifestPath: ${{ steps.package.outputs.manifestPath }}
      manifestName: ${{ steps.package.outputs.manifestName }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          token: ${{ secrets.CI_TOKEN }}
          ref: ${{ github.event.inputs.tagName }}

      - name: Resolve release tag
        id: resolve
        shell: pwsh
        run: |
          $tagName = "${{ github.event.inputs.tagName }}".Trim()
          if ("${{ github.event.inputs.mode }}" -eq "release" -and $tagName -eq "") {
              throw "tagName is required for manual release mode."
          }
          "tagName=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download desktop binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-desktop-binaries
          path: target/release

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Download and verify latest resource package
        id: resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_REPOSITORY: DearVinking/NTEye-Resources
        run: |
          $tag = gh release view --repo $env:RESOURCE_REPOSITORY --json tagName --jq .tagName
          if ($tag -notmatch '^resources-v(\d+\.\d+\.\d+)$') {
              throw "Invalid latest resource release tag: $tag"
          }
          $resourceVersion = $Matches[1]
          $resourceDir = "dist\resources"
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          gh release download $tag --repo $env:RESOURCE_REPOSITORY --dir $resourceDir `
            --pattern "nteye-resources.json" `
            --pattern "nteye-resources-$resourceVersion.zip" `
            --pattern "nteye-resources-$resourceVersion.zip.minisig"
          if ($LASTEXITCODE -ne 0) {
              throw "Resource release download failed."
          }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $appVersion = ($metadata.packages | Where-Object { $_.name -eq "nteye-desktop" }).version
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
              throw "Cannot resolve nteye-desktop version."
          }
          cargo xtask resources verify `
            --manifest "$resourceDir\nteye-resources.json" `
            --archive "$resourceDir\nteye-resources-$resourceVersion.zip" `
            --app-version $appVersion
          if ($LASTEXITCODE -ne 0) {
              throw "Resource package verification failed."
          }
          "zipPath=$resourceDir\nteye-resources-$resourceVersion.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage, smoke, and package portable build
        id: package
        shell: pwsh
        run: .\packaging\build-win-release.ps1 -SkipInstall -SkipTauriBuild -TagName "${{ steps.resolve.outputs.tagName }}" -ResourcePackageZip "${{ steps.resources.outputs.zipPath }}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-assets
          path: |
            ${{ steps.package.outputs.portableZipPath }}
            ${{ steps.package.outputs.updateZipPath }}
            ${{ steps.package.outputs.manifestPath }}
          if-no-files-found: error

  package-macos:
    name: Package macOS
    runs-on: macos-26
    outputs:
      dmgAssetName: ${{ steps.package.outputs.dmgAssetName }}
      updateAssetName: ${{ steps.package.outputs.updateAssetName }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          token: ${{ secrets.CI_TOKEN }}
          ref: ${{ github.event.inputs.tagName }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target/cargo-build-cache

      - name: Download and verify latest resource package
        id: resources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_REPOSITORY: DearVinking/NTEye-Resources
        run: |
          set -euo pipefail

          tag="$(gh release view --repo "$RESOURCE_REPOSITORY" --json tagName --jq .tagName)"
          if [[ ! "$tag" =~ ^resources-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid latest resource release tag: $tag" >&2
            exit 1
          fi
          resource_version="${BASH_REMATCH[1]}"

          resource_dir="dist/resources"
          mkdir -p "$resource_dir"
          gh release download "$tag" --repo "$RESOURCE_REPOSITORY" --dir "$resource_dir" \
            --pattern "nteye-resources.json" \
            --pattern "nteye-resources-${resource_version}.zip" \
            --pattern "nteye-resources-${resource_version}.zip.minisig"

          app_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "nteye-desktop") | .version'
          )"
          if [[ -z "$app_version" ]]; then
            echo "Cannot resolve nteye-desktop version." >&2
            exit 1
          fi

          cargo xtask resources verify \
            --manifest "$resource_dir/nteye-resources.json" \
            --archive "$resource_dir/nteye-resources-${resource_version}.zip" \
            --app-version "$app_version"

          echo "manifestPath=$resource_dir/nteye-resources.json" >> "$GITHUB_OUTPUT"
          echo "zipPath=$resource_dir/nteye-resources-${resource_version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build and package DMG
        id: package
        shell: bash
        run: >-
          packaging/mac/build-mac-dmg.sh
          --emit-update-archive
          --resource-package "${{ steps.resources.outputs.zipPath }}"
          --resource-manifest "${{ steps.resources.outputs.manifestPath }}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-assets
          path: |
            ${{ steps.package.outputs.dmgPath }}
            ${{ steps.package.outputs.updateZipPath }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-macos
    if: ${{ github.event.inputs.mode == 'release' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DearVinking/NTEye
          token: ${{ secrets.CI_TOKEN }}
          ref: ${{ needs.package-windows.outputs.tagName }}
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-assets
          path: release-assets

      - name: Download macOS release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-release-assets
          path: release-assets

      - name: Build macOS update manifest
        shell: bash
        env:
          TAG_NAME: ${{ needs.package-windows.outputs.tagName }}
          MANIFEST_NAME: ${{ needs.package-windows.outputs.manifestName }}
          MACOS_UPDATE_ASSET_NAME: ${{ needs.package-macos.outputs.updateAssetName }}
          RELEASE_REPOSITORY: DearVinking/NTEye
        run: |
          set -euo pipefail
          archive="release-assets/${MACOS_UPDATE_ASSET_NAME}"
          manifest="release-assets/${MANIFEST_NAME}"
          mac_manifest="release-assets/nteye-update-macos.json"
          size="$(stat -c '%s' "$archive")"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          download_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${MACOS_UPDATE_ASSET_NAME}"
          jq --arg asset "$MACOS_UPDATE_ASSET_NAME" \
            --arg url "$download_url" --arg size "$size" --arg sha256 "$sha256" \
            '.asset_name = $asset | .download_url = $url | .size = ($size | tonumber) | .sha256 = $sha256' \
            "$manifest" > "$mac_manifest"

      - name: Install Minisign
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign and verify release archives
        shell: bash
        env:
          PORTABLE_ASSET_NAME: ${{ needs.package-windows.outputs.portableAssetName }}
          UPDATE_ASSET_NAME: ${{ needs.package-windows.outputs.updateAssetName }}
          UPDATE_SIGNATURE_NAME: ${{ needs.package-windows.outputs.updateSignatureName }}
          DMG_ASSET_NAME: ${{ needs.package-macos.outputs.dmgAssetName }}
          MACOS_UPDATE_ASSET_NAME: ${{ needs.package-macos.outputs.updateAssetName }}
          NTEYE_MINISIGN_SECRET_KEY_B64: ${{ secrets.NTEYE_MINISIGN_SECRET_KEY_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "$NTEYE_MINISIGN_SECRET_KEY_B64" ]]; then
            echo "NTEYE_MINISIGN_SECRET_KEY_B64 is not configured" >&2
            exit 1
          fi

          secret_key="$RUNNER_TEMP/nteye-update.key"
          trap 'rm -f "$secret_key"' EXIT
          printf '%s' "$NTEYE_MINISIGN_SECRET_KEY_B64" | base64 --decode > "$secret_key"
          chmod 600 "$secret_key"

          for asset_name in "$PORTABLE_ASSET_NAME" "$UPDATE_ASSET_NAME" "$DMG_ASSET_NAME" "$MACOS_UPDATE_ASSET_NAME"; do
            minisign -S \
              -s "$secret_key" \
              -m "release-assets/${asset_name}" \
              -x "release-assets/${asset_name}.minisig"
            minisign -Vm "release-assets/${asset_name}" \
              -x "release-assets/${asset_name}.minisig" \
              -p crates/nteye-update/keys/nteye-update.pub
          done

          test -f "release-assets/${UPDATE_SIGNATURE_NAME}"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ needs.package-windows.outputs.tagName }}
          PORTABLE_ASSET_NAME: ${{ needs.package-windows.outputs.portableAssetName }}
          UPDATE_ASSET_NAME: ${{ needs.package-windows.outputs.updateAssetName }}
          UPDATE_SIGNATURE_NAME: ${{ needs.package-windows.outputs.updateSignatureName }}
          MANIFEST_NAME: ${{ needs.package-windows.outputs.manifestName }}
          MACOS_MANIFEST_NAME: nteye-update-macos.json
          DMG_ASSET_NAME: ${{ needs.package-macos.outputs.dmgAssetName }}
          MACOS_UPDATE_ASSET_NAME: ${{ needs.package-macos.outputs.updateAssetName }}
          RELEASE_REPOSITORY: DearVinking/NTEye
        run: |
          set -euo pipefail

          git fetch --tags --force

          previous_tag="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${TAG_NAME}"
          else
            range="$TAG_NAME"
          fi

          {
            echo "### 更新日志 ${TAG_NAME}:"
            commits="$(git log --pretty=format:'* %s (%an)' "$range" || true)"
            if [[ -n "$commits" ]]; then
              echo "$commits"
            else
              echo "* 暂无可列出的提交记录。"
            fi
            echo
            echo "### 下载说明"
            echo "* Windows：[${PORTABLE_ASSET_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${PORTABLE_ASSET_NAME})"
            echo "  * 下载后解压，运行 \`nteye.exe\` 即可。"
            echo "* macOS 26+（Apple Silicon）：[${DMG_ASSET_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${DMG_ASSET_NAME})"
            echo "  * 挂载后把 \`NTEye.app\` 拖进 \`Applications\`。"
            echo "  * 本包为 ad-hoc 签名，未经 Apple 公证：首次打开若被 Gatekeeper 拦截，在终端执行 \`xattr -cr /Applications/NTEye.app\` 后再打开，或前往「系统设置 → 隐私与安全性」点「仍要打开」。"
            echo "  * 抓包需要一次性安装授权组件：应用内「权限」页 → 安装授权组件 → 注销后重新登录。"
            echo "  * 另需在「权限」页授予屏幕录制与两项辅助功能权限。"
            echo "  * 已安装用户可在应用内下载 ${MACOS_UPDATE_ASSET_NAME} 更新包；更新包经过 Minisign 签名校验；ad-hoc 签名在每次更新后会变化，需重新授予屏幕录制与辅助功能权限。"
            echo
            echo "### 无需下载"
            echo "* [${UPDATE_ASSET_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${UPDATE_ASSET_NAME}) 仅供应用内更新器使用。"
            echo "* [${MACOS_MANIFEST_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${MACOS_MANIFEST_NAME}) 供 macOS 应用内更新器使用。"
            echo "* [${UPDATE_SIGNATURE_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${UPDATE_SIGNATURE_NAME}) 仅供更新器校验签名使用。"
            echo "* [${MANIFEST_NAME}](https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${MANIFEST_NAME}) 仅供应用内更新器使用。"
            echo '* `Source code zip/tar.gz` 是源码包，不是应用程序。'
          } > release-notes.md

      - name: Resolve release flags
        id: flags
        shell: bash
        env:
          AUTO_PRERELEASE: ${{ needs.package-windows.outputs.prerelease }}
          FORCE_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [[ "$AUTO_PRERELEASE" == "true" || "$FORCE_PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          echo "prereleaseFlag=${prerelease_flag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          TAG_NAME: ${{ needs.package-windows.outputs.tagName }}
          PORTABLE_ASSET_NAME: ${{ needs.package-windows.outputs.portableAssetName }}
          UPDATE_ASSET_NAME: ${{ needs.package-windows.outputs.updateAssetName }}
          UPDATE_SIGNATURE_NAME: ${{ needs.package-windows.outputs.updateSignatureName }}
          MANIFEST_NAME: ${{ needs.package-windows.outputs.manifestName }}
          MACOS_MANIFEST_NAME: nteye-update-macos.json
          DMG_ASSET_NAME: ${{ needs.package-macos.outputs.dmgAssetName }}
          MACOS_UPDATE_ASSET_NAME: ${{ needs.package-macos.outputs.updateAssetName }}
          PRERELEASE_FLAG: ${{ steps.flags.outputs.prereleaseFlag }}
          RELEASE_REPOSITORY: DearVinking/NTEye
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG_NAME" >&2
            exit 1
          fi

          gh release create "$TAG_NAME" \
            "release-assets/${PORTABLE_ASSET_NAME}" \
            "release-assets/${PORTABLE_ASSET_NAME}.minisig" \
            "release-assets/${DMG_ASSET_NAME}" \
            "release-assets/${DMG_ASSET_NAME}.minisig" \
            "release-assets/${MACOS_UPDATE_ASSET_NAME}" \
            "release-assets/${MACOS_UPDATE_ASSET_NAME}.minisig" \
            "release-assets/${UPDATE_ASSET_NAME}" \
            "release-assets/${UPDATE_SIGNATURE_NAME}" \
            "release-assets/${MANIFEST_NAME}" \
            "release-assets/${MACOS_MANIFEST_NAME}" \
            --repo "$RELEASE_REPOSITORY" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Clean up workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].id' \
            | while read -r artifact_id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                echo "deleted artifact ${artifact_id}"
              done
